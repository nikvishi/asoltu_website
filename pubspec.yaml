name: asoltu_website
description: ASOLTU corporate SaaS marketing website (asoltu.com). Separate from ERP (erp.asoltu.com).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  firebase_core: 4.11.0
  cloud_firestore: 6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logos/
    - assets/images/
    - assets/icons/
