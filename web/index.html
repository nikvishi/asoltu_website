        radial-gradient(520px 420px at 72% 42%, rgba(224,154,0,0.13), transparent 70%),
        #FBFAFF;
      transition: opacity .45s ease;
    }
    @media (prefers-color-scheme: dark) {
      .asoltu-boot {
        color: #F6F6FF;
        background:
          radial-gradient(760px 560px at 18% -8%, rgba(110,139,255,0.30), transparent 70%),
          radial-gradient(700px 520px at 84% 2%, rgba(160,124,255,0.28), transparent 70%),
          radial-gradient(520px 420px at 72% 42%, rgba(255,201,77,0.14), transparent 70%),
          #0A0A1B;
      }
    }
    .asoltu-boot.is-done { opacity: 0; pointer-events: none; }

    .boot-mark {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 18px 40px rgba(18,14,46,0.22);
      animation: bootRise .6s cubic-bezier(.2,.8,.2,1) both;
    }

    .boot-title {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: -1.4px;
      margin: 0;
      text-align: center;
      animation: bootRise .6s cubic-bezier(.2,.8,.2,1) .08s both;
    }
    .boot-title .accent {
      background: linear-gradient(90deg, #3A5BF5, #7B3DF0, #E09A00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      .boot-title .accent {
        background: linear-gradient(90deg, #7DA0FF, #B98CFF, #FFC94D);
        -webkit-background-clip: text;
        background-clip: text;
      }
    }

    .boot-sub {
      margin: 0;
      font-size: 15px;
      opacity: .62;
      text-align: center;
      padding: 0 24px;
      animation: bootRise .6s cubic-bezier(.2,.8,.2,1) .16s both;
    }

    .loading-bar-container {
      width: 180px;
      height: 3px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(18,14,46,0.10);
      animation: bootRise .6s cubic-bezier(.2,.8,.2,1) .24s both;
    }
    @media (prefers-color-scheme: dark) {
      .loading-bar-container { background: rgba(255,255,255,0.12); }
    }
    .loading-bar {
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #3A5BF5, #7B3DF0, #E09A00);
      animation: bootSlide 1.1s ease-in-out infinite;
    }

    @keyframes bootRise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes bootSlide {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(255%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-mark, .boot-title, .boot-sub, .loading-bar-container { animation: none; }
      .loading-bar { animation-duration: 2.4s; }
    }

    .skip-link {
      position: absolute;
      left: -9999px;
    }
    .skip-link:focus {
      left: 12px;
      top: 12px;
      background: #fff;
      color: #120E2E;
      padding: 8px 14px;
      border-radius: 8px;
      z-index: 99;
    }
